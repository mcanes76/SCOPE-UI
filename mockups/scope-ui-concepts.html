const state={concept:0,view:'workspace',app:'BLOS',value:42,mode:'Review',checked:true,enabled:true,preset:'Standard',card:'Overview',name:'Operator workspace',dirty:true,events:[{time:'09:00:00',text:'Demonstrator initialized.'}],busy:false,revision:0};

const $=(q,root=document)=>root.querySelector(q);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tokens(c){return `--accent:${c.accent};--bg:${c.bg};--panel:${c.panel};--raised:${c.raised};--line:${c.line};--radius:${c.radius}px;--gap:${c.gap}px;--font:${c.font};--heading:${c.heading};--base:${c.base}px;--title:${c.title}px;--weight:${c.weight};--muted:${semantic.muted}`;}
function time(){return `09:${String(Math.floor(state.events.length/60)).padStart(2,'0')}:${String(state.events.length%60).padStart(2,'0')}`;}
function notify(message){const box=$('#notification');box.textContent=message;box.setAttribute('data-tone',/^(×|Sample not applied)/.test(message)?'error':message.includes('working…')?'info':'success');}
function log(message){state.events.push({time:time(),text:message});renderEvents();notify(message);}
function renderEvents(){const list=$('#events');if(list)list.innerHTML=state.events.slice(-5).reverse().map(e=>`<li><time>${e.time} · DEMO</time>${escapeHTML(e.text)}</li>`).join('');}
function renderTabs(){const host=$('#concept-tabs');host.innerHTML=[...concepts.map((c,i)=>`<button role="tab" id="concept-tab-${i}" aria-controls="concept-panel-${i}" aria-selected="${state.concept===i}" tabindex="${state.concept===i?0:-1}" data-concept="${i}"><span>${String(i+1).padStart(2,'0')}</span>${c.name}</button>`),`<button role="tab" id="concept-tab-12" aria-controls="concept-panel-12" aria-selected="${state.concept===12}" tabindex="${state.concept===12?0:-1}" data-concept="12">Comparison · 12 design directions</button>`].join('');}
function ensurePanelTargets(){for(let i=0;i<13;i++){if(i!==state.concept)$('#primary-workspace').insertAdjacentHTML('beforeend',`<div id="concept-panel-${i}" role="tabpanel" aria-labelledby="concept-tab-${i}" hidden></div>`);}}
function appNav(){return `<nav class="app-nav" aria-label="Placeholder applications"><div class="eyebrow muted">Applications / 04</div>${apps.map((a,i)=>`<button data-app="${a}" aria-pressed="${state.app===a}"><span>${a}</span><span class="nav-symbol" aria-hidden="true">${i===3?'△':'↗'}</span><span class="small">${i===3?'Unavailable':'Ready'}</span></button>`).join('')}<p class="nav-note">Independent applications.<br>Shared operator frame.<br><br>Availability is simulated.</p></nav>`;}
function summary(){return `<div class="summary-grid"><article class="metric"><span class="metric-label">Generic demonstration value</span><strong class="value" id="demo-value">${state.value}<span class="small"> units</span></strong><small>Sample data · no operational meaning</small></article><article class="metric"><span class="metric-label">Local feedback</span><strong class="value word" id="feedback-state">${state.enabled?'Enabled':'Paused'}</strong><small>Checkbox switch · local state only</small></article><article class="metric"><span class="metric-label">Configuration</span><strong class="value word" id="config-state">${!state.dirty&&state.revision?'Saved r'+state.revision:'Draft'}</strong><small id="config-name">${escapeHTML(state.name)}</small></article></div>`;}
function content(){return `<section class="panel content"><div class="section-top"><div><div class="eyebrow muted">Application boundary</div><h3 id="application-title">${state.app} / placeholder workspace</h3></div><span class="badge ${state.app==='Native LOS'?'warning':'success'}" id="app-status">${state.app==='Native LOS'?'△ Unavailable':'✓ Available · demo'}</span></div><div id="app-boundary" class="boundary ${state.app==='Native LOS'?'unavailable':''}"><strong>${state.app==='Native LOS'?'Application unavailable':'Independent application content belongs here'}</strong><p>${state.app==='Native LOS'?'This sample application is unavailable. Select another application; the SCOPE shell and local interaction examples remain usable. No connection is attempted.':'This is a generic integration placeholder. Application functionality and backend ownership remain outside the SCOPE shell.'}</p></div><div class="section-top"><h3>Interaction workbench</h3><span class="tooltip-wrap"><button data-action="tooltip" aria-expanded="false" aria-describedby="workbench-tip" aria-label="About the workbench">?</button><span class="tip" role="tooltip" id="workbench-tip">Local interface examples shared by every concept. Nothing is sent to an application.</span></span></div><div class="controls-grid"><fieldset><legend>Demonstration mode</legend><div class="options">${['Review','Compare'].map(m=>`<label class="choice"><input type="radio" name="demo-mode" value="${m}" ${state.mode===m?'checked':''}>${m}</label>`).join('')}<label class="choice"><input type="radio" name="demo-mode" value="Locked" disabled>Locked</label></div></fieldset><div><label class="field-label" for="demo-preset">Presentation preset</label><select id="demo-preset">${['Standard','Compact','Expanded'].map(v=>`<option ${state.preset===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="choice"><input type="checkbox" id="demo-check" ${state.checked?'checked':''}>Include sample annotation</label></div><label class="toggle-row"><input class="switch" type="checkbox" role="switch" id="demo-toggle" ${state.enabled?'checked':''}><span>Local feedback <strong id="toggle-label">${state.enabled?'on':'off'}</strong></span></label><div><label class="field-label" for="workspace-name">Workspace label</label><input type="text" id="workspace-name" maxlength="60" value="${escapeHTML(state.name)}" aria-describedby="name-help name-error"><div id="name-help" class="small muted">1–60 characters. Apply to save a local revision.</div><div id="name-error" class="small error" role="status"></div></div><fieldset><legend>Selected information panel</legend><div class="cards">${['Overview','Context'].map((v,i)=>`<button class="select-card" data-card="${v}" aria-pressed="${state.card===v}"><strong>${v}</strong><small>${i?'Secondary information':'Primary information'}</small></button>`).join('')}</div></fieldset></div><div class="actions"><button class="primary" data-action="apply">Apply sample</button><button data-action="increment">Increase value +1</button><button class="tertiary" data-action="reset">Reset sample</button><button disabled title="No operational connection exists">Operational action unavailable</button></div><div id="inline-feedback" class="inline-feedback" role="status">${escapeHTML(state.card)} panel · ${escapeHTML(state.mode)} mode · ${escapeHTML(state.preset)} preset</div><details><summary>Context & integration boundary</summary><p>The four application names identify independent integrations only. The shell owns navigation, context and common feedback. All displayed values, availability labels and timestamps are synthetic.</p><p id="annotation" ${state.checked?'':'hidden'}>Sample annotation: availability is separate from selection; an unavailable entry stays selectable so its explanation can be read.</p></details></section>`;}
function events(){return `<aside class="panel events"><div class="eyebrow muted">Local event stream</div><h3>Interaction history</h3><ul id="events" class="event-list"></ul><svg class="chart" viewBox="0 0 230 68" role="img" aria-label="Static sample trend: 38, 40, 39, 42, 41, 42 units; not operational data"><path d="M10 12V53H220" fill="none" stroke="currentColor" opacity=".45"/><polyline points="12,43 51,29 90,36 129,15 168,22 207,15" fill="none" stroke="currentColor" stroke-width="2"/><text x="10" y="66">SAMPLE 01</text><text x="162" y="66">SAMPLE 06</text></svg><p class="chart-label">Static reference trend · 38, 40, 39, 42, 41, 42 units</p><button class="tertiary" data-action="error">Show sample error</button></aside>`;}
const states=[['Default','Available; solid border and raised surface.'],['Hover','Pointer feedback; mixed accent surface and accent border.'],['Focus','3px accent outline, offset 3px; independent of selection.'],['Pressed','Inset ink line and 1px downward shift, only while activated.'],['Selected','Persistent accent border, leading inset marker and explicit selected semantics.'],['Unselected','Solid neutral border; enabled and fully legible.'],['Disabled','Dashed boundary, reduced opacity and native disabled behavior.'],['Loading','Button disabled with “Working…” and aria-busy; completion after 600ms.'],['Success','Check symbol, success text and green semantic outline.'],['Warning','Triangle symbol, warning text and amber semantic outline.'],['Error','Cross symbol, error text and rose semantic outline; invalid fields have error borders.']];
function guide(c,print=false){const palette={Background:c.bg,Panel:c.panel,Raised:c.raised,'Primary / focus':c.accent,'Secondary text':semantic.muted,Text:semantic.ink,Border:c.line,Success:semantic.success,Warning:semantic.warning,Error:semantic.error,Information:semantic.info};return `<div class="guide"><div class="guide-intro"><div><div class="eyebrow muted">SCOPE / Concept ${String(concepts.indexOf(c)+1).padStart(2,'0')} / Style guide</div><h2>${c.name}</h2><p>${c.philosophy}</p></div>${print?'':`<button class="primary no-print" data-action="print">Export Style Guide to PDF</button>`}</div><div class="guide-grid"><section class="wide"><h3>01 / Palette & semantic language</h3><div class="swatches">${Object.entries(palette).map(([label,color])=>`<div class="swatch"><i style="--swatch:${color}"></i>${label}<code>${color}</code></div>`).join('')}</div><p>Primary action and focus use the accent; secondary actions use the raised surface and border; tertiary actions use transparent underlined text. Accent ink: #0C1720. Status always includes a symbol and a word. Screen colors are authoritative; print uses dark ink on white.</p></section><section><h3>02 / Typography & spacing</h3><p>Body: ${c.font}; ${c.base}px / 1.5, weight 400. Heading family: ${c.heading}. Title: ${c.id==='desktop'?25:c.title}px / 1.2, weight ${c.weight}${c.id==='minimal'?' (450 for title)':''}. Section: 17px, weight ${c.weight}; labels: 12px / 700; metadata: 11px. Values: ${c.id==='modern'?38:30}px; state values: 20px.</p><p>Panel padding 20px, concept header 24px${c.id==='desktop'?' (18px vertically)':''}. Base gutter ${c.gap}px; field gap 20px${c.id==='industrial'?' (24px in this concept)':''}. Corner radius ${c.radius}px. Controls at least ${c.id==='industrial'?48:44}px high; exceptions: none for live targets. Native radio/checkbox glyphs have 44px label targets. Fixed-width numbers support scanning.</p></section><section><h3>03 / Layout & navigation</h3><p>${c.layout}</p><p>${c.navigation} Application selection updates the generic boundary without a reload. Native LOS is deliberately unavailable yet selectable for explanation.</p><p>Below 1100px, regions use a common two-column fallback; below 760px they stack. All designs preserve application order and form order. This demonstrator has no drag or automatic content reprioritization.</p></section><section class="wide"><h3>04 / Button state specimens</h3><p>Specimens pin hover, focus and pressed visuals for inspection; these are labeled visual references. Live controls above use actual pointer and keyboard states. Enabled specimen buttons announce their state when activated.</p><div class="specimens">${[['Default',''],['Hover','sample-hover'],['Focus','sample-focus'],['Pressed','sample-pressed'],['Selected',''],['Unselected',''],['Disabled',''],['Loading',''],['✓ Success','sample-success'],['△ Warning','sample-warning'],['× Error','sample-error']].map(([label,cls])=>`<div class="specimen"><small>${label}</small><button class="${cls}" ${['Disabled','Loading'].includes(label)?'disabled':''} ${label==='Loading'?'aria-busy="true"':''} ${['Selected','Unselected'].includes(label)?`aria-pressed="${label==='Selected'}"`:''} data-specimen="${label}">${label==='Loading'?'Working…':label}</button></div>`).join('')}</div><div class="actions"><button class="primary" data-specimen="Primary action">Primary action</button><button data-specimen="Secondary action">Secondary action</button><button class="tertiary" data-specimen="Tertiary action">Tertiary action</button><button data-action="busy" id="busy-demo" ${state.busy?'disabled aria-busy="true"':''}>${state.busy?'Working…':'Try loading → success'}</button><button data-action="error">Try error feedback</button></div><p>Primary applies a sample revision after confirmation. Secondary increments the generic value. Tertiary resets after confirmation. Loading disables repeat activation for 600ms, then shows success. Error is a labeled simulated failure and never attempts a connection.</p></section><section class="wide"><h3>05 / Radio states & selection behavior</h3><p>A radio group permits one selection. Unselected remains available; disabled cannot change. Disabled-selected indicates a locked existing choice. The six examples below use separate groups where needed to show independent states.</p><div class="specimens">${[['Unselected',false,false,''],['Selected',true,false,''],['Hovered',false,false,'sample-hover'],['Keyboard focused',false,false,'sample-focus'],['Disabled unselected',false,true,''],['Disabled selected',true,true,'']].map(([label,checked,disabled,cls],i)=>`<div class="specimen"><small>${label}</small><label class="choice ${cls}"><input type="radio" name="guide-radio-${i}" ${checked?'checked':''} ${disabled?'disabled':''} data-guide-change="${label}">${label}</label></div>`).join('')}</div><fieldset><legend>Live exclusive group — use arrow keys</legend><div class="options"><label class="choice"><input type="radio" name="guide-exclusive" checked data-guide-change="Option A">Option A</label><label class="choice"><input type="radio" name="guide-exclusive" data-guide-change="Option B">Option B</label></div></fieldset></section><section class="wide"><h3>06 / State contract</h3><table><thead><tr><th>State</th><th>Appearance & behavior</th></tr></thead><tbody>${states.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></section><section><h3>07 / Fields, checkbox & switch</h3><div class="specimens"><label class="choice"><input type="checkbox" data-guide-change="Guide checkbox" checked>Checked</label><label class="choice"><input type="checkbox" disabled>Disabled</label><label class="toggle-row"><input class="switch" type="checkbox" role="switch" checked data-guide-change="Guide switch">On / off example</label></div><label class="field-label" for="${print?'print-':''}guide-input">Field example</label><input id="${print?'print-':''}guide-input" type="text" value="Editable label" data-guide-change="Guide field"><label class="field-label" for="${print?'print-':''}guide-select">Dropdown example</label><select id="${print?'print-':''}guide-select" data-guide-change="Guide dropdown"><option>Standard</option><option>Alternative</option></select><p>Fields use background fill, neutral borders and accent focus rings; invalid uses a 2px error border with a message. Checkbox checked state has a native tick; switch changes thumb position and fill. Native option menus follow the browser/OS. Disabled uses native lockout and dashed label border. Hover adds a raised surface; focus is a separate outline; press uses native glyph feedback.</p></section><section><h3>08 / Cards, panels & tabs</h3><div class="cards"><button class="select-card" aria-pressed="true" data-guide-card="Selected panel"><strong>Selected panel</strong><small>Accent marker + selection text</small></button><button class="select-card" aria-pressed="false" data-guide-card="Other panel"><strong>Other panel</strong><small>Available, unselected</small></button></div><p>Panels use panel backgrounds and border tokens. Cards add accent borders, leading markers and “Selected” text. Hover, focus, pressed and disabled follow buttons. Application navigation uses aria-pressed; concept and view tabs use aria-selected. Selection persists after pointer release; pressing lasts only during activation. Busy applies only to actions with work in progress, not to passive labels.</p></section><section><h3>09 / Status, alerts & data</h3><div class="state-row"><span class="success">✓ Success</span><span class="warning">△ Warning</span><span class="error">× Error</span><span class="info">ⓘ Information</span></div><p>Status badges use semantic text and outlines, never color alone. Notifications appear at bottom right and announce through a polite live region; event history retains the latest five actions. Unavailability uses an explanatory warning panel. Status labels are passive, so hover, pressed and selected states do not apply.</p><p>The static trend uses a 2px accent line, a faint axis and a descriptive accessible label with exact values. It has no operational meaning. No gradients, glow, interpolation or animated alarms. A future series needs explicit units, scales, timestamps and text equivalents.</p></section><section><h3>10 / Accessibility & dark-room rationale</h3><p>${c.rationale}</p><p>Use Tab / Shift+Tab for controls, arrow keys and Home / End within tab lists, native arrow keys within radio groups; Enter / Space activates buttons. Dialogs use native modal focus containment, Escape/cancel and focus restoration. Tooltips support hover, focus and click; Escape dismisses them. Details use native disclosure semantics.</p><p>Focus ring 3px; minimum live target ${c.id==='industrial'?48:44}px. No flashing or autonomous animation. Subdued backgrounds limit bright area; saturated blue is not the primary surface. Evaluate contrast, glare, viewing distance, ambient blue lighting and fatigue with operators before a final design decision. Desktop simulation does not validate those conditions.</p></section></div><p class="print-note muted">SCOPE design exploration · local simulated data · screen palette listed above; print examples use paper-friendly ink. Browser print: select Save as PDF; enable background graphics to retain swatches. No operational interface is redesigned.</p></div>`;}
function comparison(){return `<section class="comparison"><div class="eyebrow muted">Design assessment / preliminary</div><h2>Twelve directions. One operator experience.</h2><p>Qualitative design judgments based on these mockups, not experimentally validated usability results. “Strong” identifies an apparent advantage; “Good” indicates a viable direction with caveats; “Mixed” identifies a concrete tradeoff. Density and complexity are descriptions, not benefit scores.</p><div class="candidate-grid">${[['Hybrid Operator Console','Balanced task and overview regions; test simultaneous context and scan load.'],['Modern Engineering Dashboard','Open grouping and familiar controls; test density on the intended console.'],['Mission Control Console','Stable regions and visible history; test prose legibility and fatigue.']].map(([a,b])=>`<article><div class="eyebrow muted">Promising candidate</div><h3>${a}</h3><p>${b}</p></article>`).join('')}</div><div class="table-scroll" tabindex="0" role="region" aria-label="Scrollable concept comparison"><table class="compare-table"><caption>All twelve concepts against eleven common criteria; scroll horizontally for every criterion.</caption><thead><tr><th scope="col">Concept</th>${criteria.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${concepts.map((c,i)=>`<tr><th scope="row"><button data-concept="${i}">${c.name}</button></th>${c.assessment.map(a=>`<td>${a}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3 style="margin-top:24px">Tradeoffs worth testing</h3>${concepts.map(c=>`<p><strong>${c.name}.</strong> ${c.tradeoff}</p>`).join('')}<p>All concepts inherit the same local interaction behavior, semantic statuses, focus treatment and responsive fallback. The differing judgments describe presentation, not independently implemented accessibility levels. No final style is selected. Conduct task-based keyboard, pointer, distance and sustained-use evaluations in the actual room before choosing.</p></section>`;}
function render(){renderTabs();const host=$('#primary-workspace');if(state.concept===12){host.innerHTML=`<div id="concept-panel-12" role="tabpanel" aria-labelledby="concept-tab-12">${comparison()}</div>`;ensurePanelTargets();return;}const c=concepts[state.concept];host.innerHTML=`<section id="concept-panel-${state.concept}" role="tabpanel" aria-labelledby="concept-tab-${state.concept}" class="theme ${c.id}" style="${tokens(c)}"><header class="concept-heading"><div><div class="eyebrow muted">Concept ${String(state.concept+1).padStart(2,'0')} / SCOPE</div><h2>${c.name}</h2><p>${c.philosophy}</p></div><div class="view-tabs" role="tablist" aria-label="Concept view"><button id="view-workspace" role="tab" data-view="workspace" aria-controls="workspace-panel" aria-selected="${state.view==='workspace'}" tabindex="${state.view==='workspace'?0:-1}">Workspace</button><button id="view-guide" role="tab" data-view="guide" aria-controls="guide-panel" aria-selected="${state.view==='guide'}" tabindex="${state.view==='guide'?0:-1}">Style Guide</button></div></header><div id="workspace-panel" role="tabpanel" aria-labelledby="view-workspace" ${state.view!=='workspace'?'hidden':''}><div class="workspace">${appNav()}${summary()}${content()}${events()}</div></div><div id="guide-panel" role="tabpanel" aria-labelledby="view-guide" ${state.view!=='guide'?'hidden':''}>${guide(c)}</div><footer class="footer-bar"><span>SCOPE shell / four independent application boundaries</span><span>SIMULATED · Offline · Session state resets on page reload</span></footer></section>`;ensurePanelTargets();renderEvents();}
let pendingAction=null;let dialogTrigger=null;
function confirmAction(message,action,trigger){pendingAction=action;dialogTrigger=trigger;const c=concepts[state.concept];$('#confirmation').setAttribute('style',tokens(c));$('#dialog-message').textContent=message;$('#confirmation').showModal();$('#cancel-dialog').focus();}
$('#cancel-dialog').onclick=()=>$('#confirmation').close('cancel');
$('#confirm-dialog').onclick=()=>$('#confirmation').close('confirm');
$('#confirmation').addEventListener('close',()=>{if($('#confirmation').returnValue==='confirm'&&pendingAction)pendingAction();pendingAction=null;if(dialogTrigger?.isConnected)dialogTrigger.focus();else $('#primary-workspace').focus();});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.concept!==undefined){state.concept=Number(b.dataset.concept);render();$(`#concept-tab-${state.concept}`).focus();return;}
 if(b.dataset.view){state.view=b.dataset.view;render();$(`#view-${state.view==='guide'?'guide':'workspace'}`).focus();return;}
 if(b.dataset.app){state.app=b.dataset.app;document.querySelectorAll('[data-app]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.app===state.app));$('#application-title').textContent=`${state.app} / placeholder workspace`;const off=state.app==='Native LOS';$('#app-status').className=`badge ${off?'warning':'success'}`;$('#app-status').textContent=off?'△ Unavailable':'✓ Available · demo';$('#app-boundary').className=`boundary ${off?'unavailable':''}`;$('#app-boundary').innerHTML=off?'<strong>Application unavailable</strong><p>This sample application is unavailable. Select another application; the SCOPE shell and local interaction examples remain usable. No connection is attempted.</p>':'<strong>Independent application content belongs here</strong><p>This is a generic integration placeholder. Application functionality and backend ownership remain outside the SCOPE shell.</p>';log(`${state.app} selected${off?' — unavailable sample':''}.`);return;}
 if(b.dataset.card){state.card=b.dataset.card;document.querySelectorAll('[data-card]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.card===state.card));updateFeedback();log(`${state.card} information panel selected.`);return;}
 if(b.dataset.guideCard){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));notify(`${b.dataset.guideCard} selected in style guide.`);return;}
 if(b.dataset.specimen){notify(`${b.dataset.specimen} visual specimen activated.`);return;}
 switch(b.dataset.action){case 'tooltip':{const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',open);b.parentElement.classList.toggle('dismissed',!open);b.parentElement.classList.toggle('open',open);break;}case 'increment':state.value++;$('#demo-value').innerHTML=`${state.value}<span class="small"> units</span>`;log(`Generic demonstration value increased to ${state.value}.`);break;
 case 'apply':{const input=$('#workspace-name');if(!input.value.trim()){input.setAttribute('aria-invalid','true');$('#name-error').textContent='× Enter a workspace label before applying.';input.focus();notify('Sample not applied: workspace label is required.');return;}const label=input.value.trim();confirmAction(`Apply “${label}” to this local demonstration? No operational command will be sent.`,()=>{state.name=label;state.dirty=false;state.revision++;$('#config-state').textContent='Saved r'+state.revision;$('#config-name').textContent=label;$('#inline-feedback').textContent='✓ Sample applied successfully.';log(`Sample configuration saved locally (revision ${state.revision}).`);},b);break;}
 case 'reset':confirmAction('Reset the generic value and form to their initial state? Concept and application selection will remain.',()=>{Object.assign(state,{value:42,mode:'Review',checked:true,enabled:true,preset:'Standard',card:'Overview',name:'Operator workspace',revision:0,dirty:true});render();log('Sample controls reset to initial values.');},b);break;
 case 'error':notify('× Sample error: action did not complete. This is an intentional local demonstration. Try again using another sample control.');if($('#inline-feedback')){$('#inline-feedback').textContent='× Sample error shown; no data was sent.';$('#inline-feedback').classList.add('error');}logError();break;
 case 'busy':state.busy=true;b.disabled=true;b.setAttribute('aria-busy','true');b.textContent='Working…';notify('Local demonstration working…');setTimeout(()=>{state.busy=false;const live=$('#busy-demo');if(live){live.disabled=false;live.removeAttribute('aria-busy');live.textContent='✓ Success · try again';live.classList.add('sample-success');}log('✓ Local demonstration completed successfully.');},600);break;
 case 'print':exportGuide();break;
 }
});
function logError(){state.events.push({time:time(),text:'× Simulated action error; no operational connection.'});renderEvents();}
function updateFeedback(){const el=$('#inline-feedback');if(el){el.classList.remove('error');el.textContent=`${state.card} panel · ${state.mode} mode · ${state.preset} preset`;}}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.guideChange){notify(`${t.dataset.guideChange} changed${t.type==='checkbox'?': '+(t.checked?'on':'off'):''}.`);return;}if(t.name==='demo-mode'){state.mode=t.value;log(`${t.value} mode selected.`);}if(t.id==='demo-preset'){state.preset=t.value;log(`${t.value} presentation preset selected.`);}if(t.id==='demo-check'){state.checked=t.checked;$('#annotation').hidden=!t.checked;log(`Sample annotation ${t.checked?'included':'hidden'}.`);}if(t.id==='demo-toggle'){state.enabled=t.checked;$('#toggle-label').textContent=t.checked?'on':'off';$('#feedback-state').textContent=t.checked?'Enabled':'Paused';log(`Local feedback ${t.checked?'enabled':'paused'}.`);}updateFeedback();});
document.addEventListener('input',e=>{if(e.target.id==='workspace-name'){state.name=e.target.value;state.dirty=true;e.target.removeAttribute('aria-invalid');$('#name-error').textContent='';$('#config-state').textContent='Draft';$('#config-name').textContent=state.name||'Untitled';}});
document.addEventListener('focusin',e=>{e.target.closest('.tooltip-wrap')?.classList.remove('dismissed');});
document.addEventListener('pointerout',e=>{const wrap=e.target.closest('.tooltip-wrap');if(wrap&&!wrap.contains(e.relatedTarget))wrap.classList.remove('dismissed');});
document.addEventListener('keydown',e=>{const t=e.target.closest('[role=tab]');if(t&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const list=[...t.closest('[role=tablist]').querySelectorAll('[role=tab]')];const i=list.indexOf(t);const next=e.key==='Home'?0:e.key==='End'?list.length-1:(i+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;list[next].click();}if(e.key==='Escape'){document.querySelectorAll('.tooltip-wrap').forEach(x=>{x.classList.remove('open');x.classList.add('dismissed');x.querySelector('button').setAttribute('aria-expanded','false');});}});
function exportGuide(){const c=concepts[state.concept];const root=$('#print-root');root.className=`theme ${c.id}`;root.setAttribute('style',tokens(c));root.innerHTML=guide(c,true);root.querySelectorAll('input,button,select').forEach(el=>el.tabIndex=-1);const oldTitle=document.title;document.title=`SCOPE — ${c.name} — Style Guide`;window.print();document.title=oldTitle;}
// Keep a useful concept-specific guide for the browser's own Ctrl+P path too.
window.addEventListener('beforeprint',()=>{if(state.concept<12){const c=concepts[state.concept];const root=$('#print-root');root.className=`theme ${c.id}`;root.setAttribute('style',tokens(c));root.innerHTML=guide(c,true);}else{$('#print-root').innerHTML='<h1>SCOPE concept comparison</h1><p>Select a concept and use Export Style Guide to PDF for its complete style guide.</p>';}});
window.addEventListener('afterprint',()=>{$('#print-root').innerHTML='';});
render();
</script>
</body>
</html>
